services:
  db:
    image: postgres:16-alpine
    container_name: petface-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: petface
      POSTGRES_PASSWORD: petface
      POSTGRES_DB: petface
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (con el volumen vacío). Para re-ejecutarlos: npm run db:reset
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petface -d petface"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
