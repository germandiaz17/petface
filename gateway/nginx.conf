# API Gateway de PetFace: única puerta de entrada al sistema distribuido.

# Réplicas de la API. Nginx reparte las peticiones entre ellas (round robin).
# Si una réplica falla, la marca como caída y envía el tráfico a la otra.
upstream api {
    server api-1:3000 max_fails=1 fail_timeout=10s;
    server api-2:3000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    client_max_body_size 5m;
    # Si una réplica está apagada, no esperar más de 2 s antes de probar con la otra
    proxy_connect_timeout 2s;
    root /usr/share/nginx/html;

    # CRUD en vivo (Server-Sent Events): conexión larga, cada mensaje se entrega al momento
    location = /api/mascotas/eventos {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # API principal → réplicas
    location /api/ {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fotos subidas (volumen compartido por las réplicas)
    location /uploads/ {
        proxy_pass http://api;
    }

    # Microservicio de notificaciones
    location /notif/ {
        proxy_pass http://notificaciones:3001;
        proxy_set_header Host $host;
    }

    # Web (React): cualquier otra ruta devuelve la app
    location / {
        try_files $uri /index.html;
    }
}
